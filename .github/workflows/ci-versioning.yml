name: CI Versioning (Offline)

on:
  pull_request:
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  versioning-offline:
    name: Versioning offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uploader and Edge test dependencies
        run: npm ci --ignore-scripts --workspaces=false --omit=dev --no-audit --no-fund

      - name: Run versioning, callback, retention and sourcemap suites
        run: node --test tooling/versioning/*.test.mjs tooling/observability/upload-sourcemaps.test.mjs

      - name: Run ZIP preparation suites
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tooling/versioning/test-*.py; do
            python -B "$test_file"
          done

      - name: Exercise the OPS callback through its Edge handler
        env:
          DENO_NO_UPDATE_CHECK: "1"
        run: >-
          node node_modules/deno/bin.cjs test --no-config --no-lock --no-remote --no-npm --no-check
          --import-map=tooling/versioning/deploy-callback-integration/imports.json
          --allow-env=VERSIONING_DEPLOY_CALLBACK_TOKEN,OBS_RELEASE_SYNC_TOKEN,OBS_RELEASE_SYNC_URL_STAGING,OBS_RELEASE_SYNC_TENANT_HINT
          tooling/versioning/deploy-callback-integration/handler_test.ts

      - name: Exercise OPS reconciliation authorization
        env:
          DENO_NO_UPDATE_CHECK: "1"
        run: >-
          node node_modules/deno/bin.cjs test --no-config --no-lock --no-remote --no-npm --no-check
          --import-map=tooling/versioning/deploy-callback-integration/imports.json
          --allow-env=VERSIONING_DEPLOY_RECONCILE_TOKEN,VERSIONING_DEPLOY_CALLBACK_TOKEN,VERSIONING_DEPLOY_RECONCILE_ENVS,NETLIFY_AUTH_TOKEN
          tooling/versioning/deploy-callback-integration/reconciliation_handler_test.ts

      - name: Exercise independent OBS receipt and recovery
        env:
          DENO_NO_UPDATE_CHECK: "1"
        run: >-
          node node_modules/deno/bin.cjs test --no-config --no-lock --no-remote --no-npm --no-check
          --import-map=tooling/versioning/deploy-callback-integration/imports.json
          --allow-env=VERSIONING_OPS_URL,VERSIONING_OPS_SECRET_KEY,OBS_RELEASE_SYNC_TOKEN,OBS_RELEASE_SYNC_URL_STAGING,OBS_RELEASE_SYNC_TENANT_HINT
          tooling/versioning/deploy-callback-integration/obs_release_sync_test.ts

  versioning-postgres:
    name: Versioning PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: versioning-fixture
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply OPS versioning migrations and run SQL regressions
        env:
          VERSIONING_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          VERSIONING_TEST_POSTGRES_PASSWORD: versioning-fixture
        run: node tooling/versioning/run-ops-postgres-tests.mjs
