name: Versioning Deploy Artifact
run-name: "OPS ${{ inputs.deploy_execution_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID de la solicitud de deploy"
        required: true
        type: string
      product_key:
        description: "Producto (referidos_app | prelaunch_web)"
        required: true
        type: string
      env_key:
        description: "Entorno destino (staging | prod)"
        required: true
        type: string
      semver:
        description: "Version semver"
        required: true
        type: string
      source_commit_sha:
        description: "Commit exacto a desplegar"
        required: true
        type: string
      source_branch:
        description: "Rama origen"
        required: false
        type: string
      target_branch:
        description: "Rama destino"
        required: false
        type: string
      callback_url:
        description: "URL exacta del callback de OPS configurado"
        required: true
        type: string
      deploy_execution_id:
        description: "ID interno de ejecucion de deploy"
        required: true
        type: string
      actor:
        description: "Actor que disparo el deploy"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  deploy-artifact:
    runs-on: ubuntu-latest
    concurrency:
      group: versioning-artifact-${{ inputs.product_key }}-${{ inputs.env_key }}
      cancel-in-progress: false
    env:
      PRODUCT_KEY: ${{ inputs.product_key }}
      ENV_KEY: ${{ inputs.env_key }}
      REQUEST_ID: ${{ inputs.request_id }}
      SEMVER: ${{ inputs.semver }}
      SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      CALLBACK_URL: ${{ inputs.callback_url }}
      DEPLOY_EXECUTION_ID: ${{ inputs.deploy_execution_id }}
      WORKFLOW_ACTOR: ${{ inputs.actor }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID_REFERIDOS_APP_STAGING: ${{ secrets.NETLIFY_SITE_ID_REFERIDOS_APP_STAGING }}
      NETLIFY_SITE_ID_REFERIDOS_APP_PROD: ${{ secrets.NETLIFY_SITE_ID_REFERIDOS_APP_PROD }}
      NETLIFY_SITE_ID_PRELAUNCH_WEB_STAGING: ${{ secrets.NETLIFY_SITE_ID_PRELAUNCH_WEB_STAGING }}
      NETLIFY_SITE_ID_PRELAUNCH_WEB_PROD: ${{ secrets.NETLIFY_SITE_ID_PRELAUNCH_WEB_PROD }}
      OBS_SUPABASE_URL_STAGING: ${{ secrets.OBS_SUPABASE_URL_STAGING }}
      OBS_SUPABASE_URL_PROD: ${{ secrets.OBS_SUPABASE_URL_PROD }}
      OBS_SUPABASE_SECRET_KEY_STAGING: ${{ secrets.OBS_SUPABASE_SECRET_KEY_STAGING }}
      OBS_SUPABASE_SECRET_KEY_PROD: ${{ secrets.OBS_SUPABASE_SECRET_KEY_PROD }}
      OBS_SUPABASE_SERVICE_ROLE_KEY_STAGING: ${{ secrets.OBS_SUPABASE_SERVICE_ROLE_KEY_STAGING }}
      OBS_SUPABASE_SERVICE_ROLE_KEY_PROD: ${{ secrets.OBS_SUPABASE_SERVICE_ROLE_KEY_PROD }}
      VITE_SUPABASE_URL_STAGING: ${{ secrets.VITE_SUPABASE_URL_STAGING }}
      VITE_SUPABASE_URL_PROD: ${{ secrets.VITE_SUPABASE_URL_PROD }}
      VITE_SUPABASE_ANON_KEY_STAGING: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}
      VITE_SUPABASE_ANON_KEY_PROD: ${{ secrets.VITE_SUPABASE_ANON_KEY_PROD }}
      OBS_TENANT_ID_STAGING: ${{ secrets.OBS_TENANT_ID_STAGING }}
      OBS_TENANT_ID_PROD: ${{ secrets.OBS_TENANT_ID_PROD }}
      OBS_TENANT_NAME_STAGING: ${{ secrets.OBS_TENANT_NAME_STAGING }}
      OBS_TENANT_NAME_PROD: ${{ secrets.OBS_TENANT_NAME_PROD }}
      SUPABASE_URL_STAGING: ${{ secrets.SUPABASE_URL_STAGING }}
      SUPABASE_URL_PROD: ${{ secrets.SUPABASE_URL_PROD }}
      SUPABASE_SECRET_KEY_STAGING: ${{ secrets.SUPABASE_SECRET_KEY_STAGING }}
      SUPABASE_SECRET_KEY_PROD: ${{ secrets.SUPABASE_SECRET_KEY_PROD }}
      SUPABASE_SERVICE_ROLE_KEY_STAGING: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}
      SUPABASE_SERVICE_ROLE_KEY_PROD: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PROD }}
      VERSIONING_ARTIFACTS_BUCKET: ${{ secrets.VERSIONING_ARTIFACTS_BUCKET }}
    steps:
      - name: Comprobar intento único
        shell: bash
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "Consulta y concilia el intento original antes de intentar otra publicación."
            exit 1
          fi

      - name: Checkout de las herramientas del workflow
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar destino del callback
        shell: bash
        env:
          OPS_URL: ${{ secrets.SUPABASE_URL }}
          VERSIONING_DEPLOY_CALLBACK_TOKEN: ${{ secrets.VERSIONING_DEPLOY_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { resolveDeployCallbackUrl } from "./tooling/versioning/deploy-callback.mjs";
          if (!process.env.CALLBACK_URL || !process.env.VERSIONING_DEPLOY_CALLBACK_TOKEN?.trim()) {
            throw new Error("Falta el destino o la credencial del callback de OPS.");
          }
          resolveDeployCallbackUrl(process.env.OPS_URL, process.env.CALLBACK_URL);
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verificar solicitud y release en OPS
        id: deploy_request
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { getSupabaseAdminClient } from "./tooling/versioning/supabase-client.mjs";
          import { resolveReleaseForDeploy, releaseOutputs } from "./tooling/versioning/release-artifact-integrity.mjs";

          const bound = await resolveReleaseForDeploy(getSupabaseAdminClient(), {
            requestId: process.env.REQUEST_ID,
            productKey: process.env.PRODUCT_KEY,
            envKey: process.env.ENV_KEY,
            semver: process.env.SEMVER,
            sourceCommitSha: process.env.SOURCE_COMMIT_SHA,
            deployExecutionId: process.env.DEPLOY_EXECUTION_ID,
          });
          writeFileSync(join(process.env.RUNNER_TEMP, "versioning-deploy-request.json"), JSON.stringify(bound.expected), { mode: 0o600 });
          for (const [key, value] of Object.entries(releaseOutputs(bound))) {
            const outputValue = String(value ?? "");
            if (/[\r\n]/.test(outputValue)) throw new Error("Metadatos de release no válidos.");
            appendFileSync(process.env.GITHUB_OUTPUT, key + "=" + outputValue + "\n");
          }
          NODE

      - name: Validar input y resolver plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          product="${PRODUCT_KEY}"
          env_key="${ENV_KEY}"

          if [[ "$env_key" != "staging" && "$env_key" != "prod" ]]; then
            echo "Entorno invalido para deploy: $env_key"
            exit 1
          fi

          workspace=""
          netlify_filter=""
          publish_dir=""
          upload_app=""
          obs_app_id=""
          specific_site_id=""
          required_site_secret=""

          if [[ "$product" == "referidos_app" ]]; then
            workspace="@referidos/referidos-app"
            netlify_filter="@referidos/referidos-app"
            publish_dir="apps/referidos-app/dist"
            upload_app="referidos-app"
            obs_app_id="referidos-app"
            if [[ "$env_key" == "staging" ]]; then
              specific_site_id="${NETLIFY_SITE_ID_REFERIDOS_APP_STAGING}"
              required_site_secret="NETLIFY_SITE_ID_REFERIDOS_APP_STAGING"
            else
              specific_site_id="${NETLIFY_SITE_ID_REFERIDOS_APP_PROD}"
              required_site_secret="NETLIFY_SITE_ID_REFERIDOS_APP_PROD"
            fi
          elif [[ "$product" == "prelaunch_web" ]]; then
            workspace="@referidos/prelaunch"
            netlify_filter="@referidos/prelaunch"
            publish_dir="apps/prelaunch/dist"
            upload_app="prelaunch"
            obs_app_id="prelaunch"
            if [[ "$env_key" == "staging" ]]; then
              specific_site_id="${NETLIFY_SITE_ID_PRELAUNCH_WEB_STAGING}"
              required_site_secret="NETLIFY_SITE_ID_PRELAUNCH_WEB_STAGING"
            else
              specific_site_id="${NETLIFY_SITE_ID_PRELAUNCH_WEB_PROD}"
              required_site_secret="NETLIFY_SITE_ID_PRELAUNCH_WEB_PROD"
            fi
          else
            echo "Producto no soportado para deploy web por artifact exacto: $product"
            exit 1
          fi

          site_id="${specific_site_id}"
          if [[ -z "$site_id" ]]; then
            echo "Falta secret requerido ${required_site_secret} para product=${product} env=${env_key}"
            exit 1
          fi

          if [[ -z "${NETLIFY_AUTH_TOKEN}" ]]; then
            echo "Falta secret NETLIFY_AUTH_TOKEN"
            exit 1
          fi

          echo "workspace=${workspace}" >> "$GITHUB_OUTPUT"
          echo "netlify_filter=${netlify_filter}" >> "$GITHUB_OUTPUT"
          echo "publish_dir=${publish_dir}" >> "$GITHUB_OUTPUT"
          echo "upload_app=${upload_app}" >> "$GITHUB_OUTPUT"
          echo "obs_app_id=${obs_app_id}" >> "$GITHUB_OUTPUT"
          echo "site_id=${site_id}" >> "$GITHUB_OUTPUT"

      - name: Resolver credenciales Supabase observability
        id: obs
        shell: bash
        run: |
          set -euo pipefail

          env_key="${ENV_KEY}"
          obs_url=""
          obs_secret=""

          if [[ "$env_key" == "staging" ]]; then
            obs_url="${OBS_SUPABASE_URL_STAGING:-${SUPABASE_URL_STAGING:-}}"
            obs_secret="${OBS_SUPABASE_SECRET_KEY_STAGING:-${OBS_SUPABASE_SERVICE_ROLE_KEY_STAGING:-${SUPABASE_SECRET_KEY_STAGING:-${SUPABASE_SERVICE_ROLE_KEY_STAGING:-}}}}"
          else
            obs_url="${OBS_SUPABASE_URL_PROD:-${SUPABASE_URL_PROD:-}}"
            obs_secret="${OBS_SUPABASE_SECRET_KEY_PROD:-${OBS_SUPABASE_SERVICE_ROLE_KEY_PROD:-${SUPABASE_SECRET_KEY_PROD:-${SUPABASE_SERVICE_ROLE_KEY_PROD:-}}}}"
          fi

          if [[ -z "$obs_url" ]]; then
            echo "Falta secret OBS_SUPABASE_URL_${env_key^^}"
            exit 1
          fi
          if [[ -z "$obs_secret" ]]; then
            echo "Falta secret OBS_SUPABASE_SECRET_KEY_${env_key^^} (o OBS_SUPABASE_SERVICE_ROLE_KEY_${env_key^^})"
            exit 1
          fi

          echo "obs_url=${obs_url}" >> "$GITHUB_OUTPUT"
          echo "obs_secret=${obs_secret}" >> "$GITHUB_OUTPUT"

      - name: Resolver variables Vite Supabase
        id: vite_supabase
        shell: bash
        run: |
          set -euo pipefail

          env_key="${ENV_KEY}"
          vite_url=""
          vite_anon_key=""

          has_value() {
            if [[ -n "${1:-}" ]]; then
              echo "yes"
            else
              echo "no"
            fi
          }

          if [[ "$env_key" == "staging" ]]; then
            vite_url="${VITE_SUPABASE_URL_STAGING:-}"
            vite_anon_key="${VITE_SUPABASE_ANON_KEY_STAGING:-}"
          else
            vite_url="${VITE_SUPABASE_URL_PROD:-}"
            vite_anon_key="${VITE_SUPABASE_ANON_KEY_PROD:-}"
          fi

          if [[ -z "$vite_url" ]]; then
            echo "Falta VITE_SUPABASE_URL para ${env_key}"
            echo "Diagnostico URL keys: VITE_SUPABASE_URL_STAGING=$(has_value "${VITE_SUPABASE_URL_STAGING:-}") VITE_SUPABASE_URL_PROD=$(has_value "${VITE_SUPABASE_URL_PROD:-}")"
            exit 1
          fi
          if [[ -z "$vite_anon_key" ]]; then
            echo "Falta VITE_SUPABASE_ANON_KEY para ${env_key}"
            echo "Diagnostico ANON keys: VITE_SUPABASE_ANON_KEY_STAGING=$(has_value "${VITE_SUPABASE_ANON_KEY_STAGING:-}") VITE_SUPABASE_ANON_KEY_PROD=$(has_value "${VITE_SUPABASE_ANON_KEY_PROD:-}")"
            exit 1
          fi

          echo "vite_supabase_url=${vite_url}" >> "$GITHUB_OUTPUT"
          echo "vite_supabase_anon_key=${vite_anon_key}" >> "$GITHUB_OUTPUT"

      - name: Resolver tenant observability
        id: obs_tenant
        shell: bash
        run: |
          set -euo pipefail

          env_key="${ENV_KEY}"
          tenant_id=""
          tenant_name=""

          if [[ "$env_key" == "staging" ]]; then
            tenant_id="${OBS_TENANT_ID_STAGING:-}"
            tenant_name="${OBS_TENANT_NAME_STAGING:-}"
          else
            tenant_id="${OBS_TENANT_ID_PROD:-}"
            tenant_name="${OBS_TENANT_NAME_PROD:-}"
          fi

          if [[ -z "$tenant_id" || -z "$tenant_name" ]]; then
            echo "Configura el ID y nombre can?nicos del tenant de observability de este entorno."
            exit 1
          fi

          echo "tenant_id=${tenant_id}" >> "$GITHUB_OUTPUT"
          echo "tenant_name=${tenant_name}" >> "$GITHUB_OUTPUT"

      - name: Resolver el artefacto exacto de la release
        id: artifact_meta
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${SOURCE_COMMIT_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$SOURCE_COMMIT_SHA"
          fi
          git cat-file -e "${SOURCE_COMMIT_SHA}^{commit}"

          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { join } from "node:path";
          import { getSupabaseAdminClient } from "./tooling/versioning/supabase-client.mjs";
          import { resolveReleaseForDeploy, resolveArtifactMetadata, metadataOutputs } from "./tooling/versioning/release-artifact-integrity.mjs";

          const input = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, "versioning-deploy-request.json"), "utf8"));
          const supabase = getSupabaseAdminClient();
          const bound = await resolveReleaseForDeploy(supabase, input, { attempts: 1 });
          const artifact = await resolveArtifactMetadata(supabase, bound);
          for (const [key, value] of Object.entries(metadataOutputs(artifact, {
            githubRepository: process.env.GITHUB_REPOSITORY,
            defaultBucket: process.env.VERSIONING_ARTIFACTS_BUCKET,
          }))) {
            const outputValue = String(value ?? "");
            if (/[\r\n]/.test(outputValue)) throw new Error("Metadatos de artefacto no válidos.");
            appendFileSync(process.env.GITHUB_OUTPUT, key + "=" + outputValue + "\n");
          }
          NODE

      - name: Verificar destinos autorizados
        shell: bash
        env:
          NETLIFY_SITE_ID: ${{ steps.plan.outputs.site_id }}
          RUNTIME_SUPABASE_URL: ${{ steps.vite_supabase.outputs.vite_supabase_url }}
          RUNTIME_SUPABASE_KEY: ${{ steps.vite_supabase.outputs.vite_supabase_anon_key }}
          OBS_SUPABASE_URL: ${{ steps.obs.outputs.obs_url }}
          OBS_PROJECT_REF_STAGING: ${{ vars.VERSIONING_OBS_PROJECT_REF_STAGING }}
          OBS_PROJECT_REF_PROD: ${{ vars.VERSIONING_OBS_PROJECT_REF_PROD }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { validateSupabaseDestinations, verifyNetlifyDestination } from "./tooling/versioning/deploy-destination.mjs";
          const productKey = process.env.PRODUCT_KEY;
          const envKey = process.env.ENV_KEY;
          validateSupabaseDestinations({
            productKey, envKey,
            runtimeUrl: process.env.RUNTIME_SUPABASE_URL,
            runtimeKey: process.env.RUNTIME_SUPABASE_KEY,
            obsUrl: process.env.OBS_SUPABASE_URL,
            obsProjectRef: envKey === "staging" ? process.env.OBS_PROJECT_REF_STAGING : process.env.OBS_PROJECT_REF_PROD,
          });
          await verifyNetlifyDestination({
            productKey, envKey, siteId: process.env.NETLIFY_SITE_ID, token: process.env.NETLIFY_AUTH_TOKEN,
          });
          NODE

      - name: Vincular el intento de GitHub en OPS
        id: start
        shell: bash
        env:
          OPS_URL: ${{ secrets.SUPABASE_URL }}
          VERSIONING_DEPLOY_CALLBACK_TOKEN: ${{ secrets.VERSIONING_DEPLOY_CALLBACK_TOKEN }}
          RELEASE_ID_RAW: ${{ steps.deploy_request.outputs.release_id }}
          RELEASE_TENANT_ID: ${{ steps.deploy_request.outputs.tenant_id }}
          ARTIFACT_ID_RAW: ${{ steps.artifact_meta.outputs.artifact_id }}
          ARTIFACT_SHA256_RAW: ${{ steps.artifact_meta.outputs.artifact_sha256 }}
          NETLIFY_SITE_ID: ${{ steps.plan.outputs.site_id }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { assertDeployCallbackAcknowledged, deployCallbackPayload, postDeployCallback } from "./tooling/versioning/deploy-callback.mjs";
          const env = process.env;
          const confirmation = await postDeployCallback({
            opsUrl: env.OPS_URL, requestedUrl: env.CALLBACK_URL, token: env.VERSIONING_DEPLOY_CALLBACK_TOKEN,
            payload: deployCallbackPayload(env, { start: true }),
          });
          assertDeployCallbackAcknowledged(confirmation, env, "started");
          NODE

      - name: Descargar el artefacto exacto de GitHub Actions
        if: ${{ steps.artifact_meta.outputs.artifact_provider == 'github_actions' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_REPO: ${{ steps.artifact_meta.outputs.artifact_repo }}
          ARTIFACT_RUN_ID: ${{ steps.artifact_meta.outputs.artifact_run_id }}
          GITHUB_ARTIFACT_ID: ${{ steps.artifact_meta.outputs.github_artifact_id }}
          GITHUB_ARTIFACT_NAME: ${{ steps.artifact_meta.outputs.github_artifact_name }}
        run: |
          set -euo pipefail
          artifact_endpoint="repos/${ARTIFACT_REPO}/actions/artifacts/${GITHUB_ARTIFACT_ID}"
          gh api "$artifact_endpoint" > "$RUNNER_TEMP/versioning-github-artifact.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          import { validateGitHubArtifact } from "./tooling/versioning/release-artifact-integrity.mjs";

          const record = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, "versioning-github-artifact.json"), "utf8"));
          validateGitHubArtifact(record, {
            artifactId: process.env.GITHUB_ARTIFACT_ID,
            artifactName: process.env.GITHUB_ARTIFACT_NAME,
            runId: process.env.ARTIFACT_RUN_ID,
          });
          NODE
          gh api "$artifact_endpoint/zip" > "$RUNNER_TEMP/versioning-release.zip"

      - name: Descargar el artefacto exacto de Supabase Storage
        if: ${{ steps.artifact_meta.outputs.artifact_provider == 'supabase_storage' }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ARTIFACT_BUCKET: ${{ steps.artifact_meta.outputs.artifact_bucket }}
          ARTIFACT_PATH: ${{ steps.artifact_meta.outputs.artifact_path }}
          ARTIFACT_SIZE: ${{ steps.artifact_meta.outputs.artifact_size_bytes }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { getSupabaseAdminClient } from "./tooling/versioning/supabase-client.mjs";

          const { data, error } = await getSupabaseAdminClient().storage
            .from(process.env.ARTIFACT_BUCKET).download(process.env.ARTIFACT_PATH);
          if (error || !data) throw new Error("No se pudo descargar el ZIP registrado desde OPS.");
          if (data.size !== Number(process.env.ARTIFACT_SIZE)) {
            throw new Error("El tamaño del ZIP descargado no coincide con el registro de OPS.");
          }
          writeFileSync(join(process.env.RUNNER_TEMP, "versioning-release.zip"), Buffer.from(await data.arrayBuffer()));
          NODE

      - name: Verificar integridad y extraer ZIP
        shell: bash
        env:
          ARTIFACT_PROVIDER: ${{ steps.artifact_meta.outputs.artifact_provider }}
          ARTIFACT_SHA256: ${{ steps.artifact_meta.outputs.artifact_sha256 }}
          ARTIFACT_SIZE: ${{ steps.artifact_meta.outputs.artifact_size_bytes }}
        run: |
          set -euo pipefail
          provider_args=()
          case "$ARTIFACT_PROVIDER" in
            github_actions) provider_args+=(--github-wrapper) ;;
            supabase_storage) ;;
            *) echo "Proveedor del artefacto no admitido."; exit 1 ;;
          esac
          python3 tooling/versioning/prepare-release-artifact.py \
            --archive "$RUNNER_TEMP/versioning-release.zip" \
            --output downloaded-artifact \
            --checksum "$ARTIFACT_SHA256" \
            --size "$ARTIFACT_SIZE" \
            "${provider_args[@]}"

      - name: Prepare publish dir from artifact
        id: build
        shell: bash
        env:
          PRODUCT_KEY: ${{ inputs.product_key }}
        run: |
          set -euo pipefail

          source_dir="downloaded-artifact"
          if [[ ! -d "$source_dir" ]]; then
            echo "Artifact descargado no existe: $source_dir"
            exit 1
          fi

          if [[ "$PRODUCT_KEY" == "referidos_app" ]]; then
            rm -rf "apps/referidos-app/dist"
            mkdir -p "apps/referidos-app/dist"
            cp -R "${source_dir}/." "apps/referidos-app/dist/"
          elif [[ "$PRODUCT_KEY" == "prelaunch_web" ]]; then
            rm -rf "apps/prelaunch/dist"
            mkdir -p "apps/prelaunch/dist"
            cp -R "${source_dir}/." "apps/prelaunch/dist/"
          else
            echo "Producto no soportado para deploy artifact: $PRODUCT_KEY"
            exit 1
          fi

          echo "publish_dir=${source_dir}" >> "$GITHUB_OUTPUT"

      - name: Verificar tenant de observabilidad sin escrituras
        id: verified_tenant
        env:
          SUPABASE_URL: ${{ steps.obs.outputs.obs_url }}
          SUPABASE_SECRET_KEY: ${{ steps.obs.outputs.obs_secret }}
          OBS_TENANT_ID: ${{ steps.obs_tenant.outputs.tenant_id }}
          OBS_TENANT_NAME: ${{ steps.obs_tenant.outputs.tenant_name }}
        run: node tooling/observability/upload-sourcemaps.mjs --verify-tenant-only

      - name: Upload sourcemaps + registrar release metadata
        id: sourcemaps
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_URL: ${{ steps.obs.outputs.obs_url }}
          SUPABASE_SECRET_KEY: ${{ steps.obs.outputs.obs_secret }}
          OBS_TENANT_ID: ${{ steps.obs_tenant.outputs.tenant_id }}
          OBS_TENANT_NAME: ${{ steps.obs_tenant.outputs.tenant_name }}
          APP_ID: ${{ steps.plan.outputs.obs_app_id }}
          APP_VERSION: ${{ inputs.semver }}
          BUILD_ID: ${{ steps.deploy_request.outputs.release_build_number || inputs.source_commit_sha }}
          APP_ENV: ${{ inputs.env_key }}
          VITE_APP_ID: ${{ steps.plan.outputs.obs_app_id }}
          VITE_APP_VERSION: ${{ inputs.semver }}
          VITE_BUILD_ID: ${{ steps.deploy_request.outputs.release_build_number || inputs.source_commit_sha }}
          VITE_SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
          VITE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
          VITE_ENV: ${{ inputs.env_key }}
        run: |
          set -euo pipefail
          node tooling/observability/upload-sourcemaps.mjs --app "${{ steps.plan.outputs.upload_app }}"

      - name: Generar runtime app-config.js
        id: runtime_config
        shell: bash
        env:
          PUBLISH_DIR: ${{ steps.build.outputs.publish_dir }}
          RUNTIME_PRODUCT_KEY: ${{ inputs.product_key }}
          RUNTIME_ENV_KEY: ${{ inputs.env_key }}
          RUNTIME_APP_ID: ${{ steps.plan.outputs.obs_app_id }}
          RUNTIME_APP_VERSION: ${{ inputs.semver }}
          RUNTIME_BUILD_NUMBER: ${{ steps.deploy_request.outputs.release_build_number }}
          RUNTIME_BUILD_ID: ${{ inputs.source_commit_sha }}
          RUNTIME_RELEASE_ID: ${{ steps.deploy_request.outputs.release_id }}
          RUNTIME_ARTIFACT_ID: ${{ steps.artifact_meta.outputs.artifact_id }}
          RUNTIME_RELEASE_CHANNEL: ${{ steps.deploy_request.outputs.release_channel }}
          RUNTIME_SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
          RUNTIME_TENANT_HINT: ${{ steps.verified_tenant.outputs.tenant_name }}
          RUNTIME_SUPABASE_URL: ${{ steps.vite_supabase.outputs.vite_supabase_url }}
          RUNTIME_SUPABASE_ANON_KEY: ${{ steps.vite_supabase.outputs.vite_supabase_anon_key }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");

          const publishDir = process.env.PUBLISH_DIR;
          const productKey = process.env.RUNTIME_PRODUCT_KEY;
          const runtimeBuildNumber = String(process.env.RUNTIME_BUILD_NUMBER || "").trim();
          const runtimeBuildId = runtimeBuildNumber || String(process.env.RUNTIME_BUILD_ID || "").trim();
          if (!process.env.RUNTIME_TENANT_HINT) throw new Error("Falta el nombre del tenant verificado.");
          const baseConfig = {
            appEnv: process.env.RUNTIME_ENV_KEY,
            appId: process.env.RUNTIME_APP_ID,
            appVersion: process.env.RUNTIME_APP_VERSION,
            buildId: runtimeBuildId,
            buildNumber: runtimeBuildNumber || null,
            releaseId: process.env.RUNTIME_RELEASE_ID || null,
            artifactId: process.env.RUNTIME_ARTIFACT_ID || null,
            releaseChannel: process.env.RUNTIME_RELEASE_CHANNEL || process.env.RUNTIME_ENV_KEY || null,
            sourceCommitSha: process.env.RUNTIME_SOURCE_COMMIT_SHA,
            defaultTenantId: process.env.RUNTIME_TENANT_HINT,
            supabaseUrl: process.env.RUNTIME_SUPABASE_URL,
          };

          let windowKey = "";
          let runtimeConfig = {};

          if (productKey === "referidos_app") {
            windowKey = "__REFERIDOS_RUNTIME_CONFIG__";
            runtimeConfig = {
              ...baseConfig,
              supabaseAnonKey: process.env.RUNTIME_SUPABASE_ANON_KEY,
            };
          } else if (productKey === "prelaunch_web") {
            windowKey = "__PRELAUNCH_RUNTIME_CONFIG__";
            runtimeConfig = {
              ...baseConfig,
              appChannel: "prelaunch_web",
              supabasePublishableKey: process.env.RUNTIME_SUPABASE_ANON_KEY,
            };
          } else {
            throw new Error(`Producto no soportado para runtime config: ${productKey}`);
          }

          const filePath = path.join(publishDir, "app-config.js");
          fs.writeFileSync(filePath, `window.${windowKey} = ${JSON.stringify(runtimeConfig, null, 2)};\n`);
          console.log(`RUNTIME_CONFIG_WRITTEN ${filePath}`);

          const payloadJson = JSON.stringify(runtimeConfig);
          const configHash = crypto.createHash("sha256").update(payloadJson).digest("hex");
          const output = process.env.GITHUB_OUTPUT;
          if (output) {
            fs.appendFileSync(output, "runtime_config_key=app-config.js\n");
            fs.appendFileSync(output, `runtime_config_sha256=${configHash}\n`);
            fs.appendFileSync(output, "runtime_config_payload<<EOF\n");
            fs.appendFileSync(output, `${payloadJson}\n`);
            fs.appendFileSync(output, "EOF\n");
          }
          NODE

      - name: Revalidar la release y el artefacto antes de publicar
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          REGISTERED_ARTIFACT_ID: ${{ steps.artifact_meta.outputs.artifact_id }}
          REGISTERED_ARTIFACT_SHA: ${{ steps.artifact_meta.outputs.artifact_sha256 }}
          REGISTERED_ARTIFACT_SIZE: ${{ steps.artifact_meta.outputs.artifact_size_bytes }}
          REGISTERED_ARTIFACT_PROVIDER: ${{ steps.artifact_meta.outputs.artifact_provider }}
          REGISTERED_ARTIFACT_BUCKET: ${{ steps.artifact_meta.outputs.artifact_bucket }}
          REGISTERED_ARTIFACT_PATH: ${{ steps.artifact_meta.outputs.artifact_path }}
          REGISTERED_ARTIFACT_NAME: ${{ steps.artifact_meta.outputs.artifact_name }}
          REGISTERED_ARTIFACT_RUN: ${{ steps.artifact_meta.outputs.artifact_run_id }}
          REGISTERED_GITHUB_ARTIFACT_ID: ${{ steps.artifact_meta.outputs.github_artifact_id }}
          REGISTERED_RELEASE_ID: ${{ steps.deploy_request.outputs.release_id }}
          REGISTERED_TENANT_ID: ${{ steps.deploy_request.outputs.tenant_id }}
          NETLIFY_SITE_ID: ${{ steps.plan.outputs.site_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          import { getSupabaseAdminClient } from "./tooling/versioning/supabase-client.mjs";
          import { assertBoundDeployAttempt, resolveReleaseForDeploy, resolveArtifactMetadata, metadataOutputs } from "./tooling/versioning/release-artifact-integrity.mjs";

          const env = process.env;
          const input = JSON.parse(readFileSync(join(env.RUNNER_TEMP, "versioning-deploy-request.json"), "utf8"));
          const supabase = getSupabaseAdminClient();
          const bound = await resolveReleaseForDeploy(supabase, input, { attempts: 1 });
          const artifact = metadataOutputs(await resolveArtifactMetadata(supabase, bound), {
            githubRepository: env.GITHUB_REPOSITORY, defaultBucket: env.VERSIONING_ARTIFACTS_BUCKET,
          });
          if (bound.release.id !== env.REGISTERED_RELEASE_ID || bound.request.tenant_id !== env.REGISTERED_TENANT_ID ||
              artifact.artifact_id !== env.REGISTERED_ARTIFACT_ID || artifact.artifact_sha256 !== env.REGISTERED_ARTIFACT_SHA ||
              artifact.artifact_size_bytes !== env.REGISTERED_ARTIFACT_SIZE || artifact.artifact_provider !== env.REGISTERED_ARTIFACT_PROVIDER ||
              artifact.artifact_bucket !== env.REGISTERED_ARTIFACT_BUCKET || artifact.artifact_path !== env.REGISTERED_ARTIFACT_PATH ||
              artifact.artifact_name !== env.REGISTERED_ARTIFACT_NAME || artifact.artifact_run_id !== env.REGISTERED_ARTIFACT_RUN ||
              artifact.github_artifact_id !== env.REGISTERED_GITHUB_ARTIFACT_ID) {
            throw new Error("La identidad registrada cambió después de preparar el ZIP.");
          }
          await assertBoundDeployAttempt(supabase, bound, artifact.artifact_id, artifact.artifact_sha256, {
            githubRunId: env.GITHUB_RUN_ID, netlifySiteId: env.NETLIFY_SITE_ID,
          });
          NODE

      - name: Guardar evidencia preparada y autorizar publicación en OPS
        id: prepared
        shell: bash
        env:
          OPS_URL: ${{ secrets.SUPABASE_URL }}
          VERSIONING_DEPLOY_CALLBACK_TOKEN: ${{ secrets.VERSIONING_DEPLOY_CALLBACK_TOKEN }}
          RELEASE_ID_RAW: ${{ steps.deploy_request.outputs.release_id }}
          RELEASE_TENANT_ID: ${{ steps.deploy_request.outputs.tenant_id }}
          ARTIFACT_ID_RAW: ${{ steps.artifact_meta.outputs.artifact_id }}
          ARTIFACT_SHA256_RAW: ${{ steps.artifact_meta.outputs.artifact_sha256 }}
          ARTIFACT_NAME_RAW: ${{ steps.artifact_meta.outputs.artifact_name }}
          ARTIFACT_RUN_ID_RAW: ${{ steps.artifact_meta.outputs.artifact_run_id }}
          ARTIFACT_REPOSITORY_RAW: ${{ steps.artifact_meta.outputs.artifact_repo }}
          NETLIFY_SITE_ID: ${{ steps.plan.outputs.site_id }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_NUMBER_RAW: ${{ steps.deploy_request.outputs.release_build_number }}
          CHANNEL_RAW: ${{ steps.deploy_request.outputs.release_channel }}
          RUNTIME_CONFIG_KEY_RAW: ${{ steps.runtime_config.outputs.runtime_config_key }}
          RUNTIME_CONFIG_SHA256_RAW: ${{ steps.runtime_config.outputs.runtime_config_sha256 }}
          RUNTIME_CONFIG_PAYLOAD_RAW: ${{ steps.runtime_config.outputs.runtime_config_payload }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { assertDeployCallbackAcknowledged, deployCallbackPayload, postDeployCallback } from "./tooling/versioning/deploy-callback.mjs";
          const env = process.env;
          const confirmation = await postDeployCallback({
            opsUrl: env.OPS_URL, requestedUrl: env.CALLBACK_URL, token: env.VERSIONING_DEPLOY_CALLBACK_TOKEN,
            payload: deployCallbackPayload(env, { prepared: true }),
          });
          assertDeployCallbackAcknowledged(confirmation, env, "prepared");
          NODE

      - name: Deploy artifact a Netlify
        id: deploy
        shell: bash
        env:
          NETLIFY_SITE_ID: ${{ steps.plan.outputs.site_id }}
          NETLIFY_FILTER: ${{ steps.plan.outputs.netlify_filter }}
          PUBLISH_DIR: ${{ steps.build.outputs.publish_dir }}
        run: |
          set -euo pipefail
          # The uploader used its own dist copy. Never serve the verified ZIP's source maps.
          test "$PUBLISH_DIR" = "downloaded-artifact"
          find "$PUBLISH_DIR" -type f -name '*.map' -delete
          : > "$RUNNER_TEMP/versioning-publication-invoked"
          npx --yes netlify-cli@latest deploy \
            --filter "$NETLIFY_FILTER" \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --dir "$PUBLISH_DIR" \
            --prod \
            --message "versioning:$PRODUCT_KEY:$ENV_KEY:$SEMVER:$SOURCE_COMMIT_SHA:$DEPLOY_EXECUTION_ID:$GITHUB_RUN_ID" \
            --json > "$RUNNER_TEMP/versioning-netlify-output.json"

      - name: Confirmar publicación activa en Netlify
        id: publication
        if: ${{ always() && steps.deploy.outcome != 'skipped' && steps.start.outcome == 'success' }}
        shell: bash
        env:
          NETLIFY_SITE_ID: ${{ steps.plan.outputs.site_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { join } from "node:path";
          import { readNetlifyDeployId, verifyNetlifyDestination } from "./tooling/versioning/deploy-destination.mjs";
          const env = process.env;
          let output;
          try {
            output = JSON.parse(readFileSync(join(env.RUNNER_TEMP, "versioning-netlify-output.json"), "utf8"));
          } catch {
            throw new Error("La publicación no devolvió un ID verificable. Consulta el intento antes de reintentar.");
          }
          const reportedId = readNetlifyDeployId(output);
          appendFileSync(env.GITHUB_OUTPUT, "reported_deployment_id=" + reportedId + "\n");
          const { deploymentId } = await verifyNetlifyDestination({
            productKey: env.PRODUCT_KEY, envKey: env.ENV_KEY, siteId: env.NETLIFY_SITE_ID, token: env.NETLIFY_AUTH_TOKEN,
            expectedDeployId: reportedId,
          });
          appendFileSync(env.GITHUB_OUTPUT, "deployment_id=" + deploymentId + "\n");
          NODE

      - name: Crear tag de produccion
        id: tag_prod
        if: ${{ success() && steps.publication.outcome == 'success' && inputs.env_key == 'prod' }}
        shell: bash
        run: |
          set -euo pipefail

          tag_name="v${SEMVER}"
          git fetch --tags origin

          if git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
            if [[ "$(git rev-parse "refs/tags/${tag_name}^{commit}")" != "$SOURCE_COMMIT_SHA" ]]; then
              echo "El tag existente corresponde a otro commit. La publicación ya confirmada conserva su resultado."
              exit 1
            fi
            echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Use lightweight tag to avoid requiring git user identity in CI.
          git tag "${tag_name}" "${SOURCE_COMMIT_SHA}"
          git push origin "refs/tags/${tag_name}"

          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "tag_created=true" >> "$GITHUB_OUTPUT"

      - name: Registrar evidencia de publicación en OPS
        if: ${{ always() && steps.start.outcome == 'success' }}
        shell: bash
        env:
          OPS_URL: ${{ secrets.SUPABASE_URL }}
          VERSIONING_DEPLOY_CALLBACK_TOKEN: ${{ secrets.VERSIONING_DEPLOY_CALLBACK_TOKEN }}
          RELEASE_ID_RAW: ${{ steps.deploy_request.outputs.release_id }}
          RELEASE_TENANT_ID: ${{ steps.deploy_request.outputs.tenant_id }}
          ARTIFACT_ID_RAW: ${{ steps.artifact_meta.outputs.artifact_id }}
          ARTIFACT_SHA256_RAW: ${{ steps.artifact_meta.outputs.artifact_sha256 }}
          NETLIFY_SITE_ID: ${{ steps.plan.outputs.site_id }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_NAME_RAW: ${{ steps.artifact_meta.outputs.artifact_name }}
          ARTIFACT_RUN_ID_RAW: ${{ steps.artifact_meta.outputs.artifact_run_id }}
          ARTIFACT_REPOSITORY_RAW: ${{ steps.artifact_meta.outputs.artifact_repo }}
          WORKFLOW_OUTCOME: ${{ job.status }}
          SOURCEMAP_OUTCOME: ${{ steps.sourcemaps.outcome }}
          NETLIFY_DEPLOY_ID: ${{ steps.publication.outputs.deployment_id }}
          REPORTED_NETLIFY_DEPLOY_ID: ${{ steps.publication.outputs.reported_deployment_id }}
          TAG_NAME_RAW: ${{ steps.tag_prod.outputs.tag_name }}
          TAG_CREATED_RAW: ${{ steps.tag_prod.outputs.tag_created }}
          BUILD_NUMBER_RAW: ${{ steps.deploy_request.outputs.release_build_number }}
          CHANNEL_RAW: ${{ steps.deploy_request.outputs.release_channel }}
          RUNTIME_CONFIG_KEY_RAW: ${{ steps.runtime_config.outputs.runtime_config_key }}
          RUNTIME_CONFIG_SHA256_RAW: ${{ steps.runtime_config.outputs.runtime_config_sha256 }}
          RUNTIME_CONFIG_PAYLOAD_RAW: ${{ steps.runtime_config.outputs.runtime_config_payload }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync } from "node:fs";
          import { join } from "node:path";
          import { deployCallbackPayload, postDeployCallback } from "./tooling/versioning/deploy-callback.mjs";
          const env = process.env;
          const payload = deployCallbackPayload(env, {
            deployInvoked: existsSync(join(env.RUNNER_TEMP, "versioning-publication-invoked")),
            deploymentId: env.NETLIFY_DEPLOY_ID || null,
          });
          const summary = [
            "### Evidencia de publicación",
            "- Solicitud: " + payload.request_id,
            "- Intento OPS: " + payload.deploy_execution_id,
            "- Release: " + payload.metadata.release_id,
            "- Commit: " + payload.metadata.source_commit_sha,
            "- Artefacto: " + payload.metadata.artifact_id,
            "- SHA-256: " + payload.metadata.artifact_checksum_sha256,
            "- Publicación en Netlify: " + payload.publication_status,
          ];
          if (env.NETLIFY_DEPLOY_ID) summary.push("- Deploy ID: " + env.NETLIFY_DEPLOY_ID);
          appendFileSync(env.GITHUB_STEP_SUMMARY, summary.join("\n") + "\n");
          const result = await postDeployCallback({
            opsUrl: env.OPS_URL, requestedUrl: env.CALLBACK_URL, token: env.VERSIONING_DEPLOY_CALLBACK_TOKEN, payload,
          });
          if (result.request_id !== env.REQUEST_ID || result.reconciliation?.deploy_execution_id !== env.DEPLOY_EXECUTION_ID) {
            throw new Error("OPS no confirmó el registro del resultado para este intento.");
          }
          if (result.reconciliation.status !== "complete") {
            appendFileSync(env.GITHUB_STEP_SUMMARY, "OPS guardó el resultado. Consulta el cierre oficial en la solicitud.\n");
          }
          NODE
