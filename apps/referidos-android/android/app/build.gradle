apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def promosBeta = (findProperty("referidosPromosBeta") ?: "false").toString().toBoolean()
def promosBackend = findProperty("referidosPromosBackend")?.toString() ?: "offline"
def promosConfigPath = findProperty("referidosPromosConfig")?.toString()
if (!(promosBackend in ["offline", "dev"]) || (!promosBeta && promosBackend != "offline")) {
    throw new GradleException("Promos backend must be offline, or dev on a Promos Beta build.")
}
def promosDev = promosBackend == "dev"
if (promosDev != (promosConfigPath != null && !promosConfigPath.isBlank())) {
    throw new GradleException("Set -PreferidosPromosConfig only for Promos DEV. DEV requires an explicit file.")
}
def promosDevAssets = layout.buildDirectory.dir("generated/promosDev/assets")

if (promosDev) {
    def configScript = file("../../tooling/promos-dev-config.mjs")
    def configFile = rootProject.file(promosConfigPath)
    def generateConfig = tasks.register("generatePromosDevConfig", Exec) {
        inputs.files(configScript, configFile)
        outputs.file(promosDevAssets.map { it.file("promos-backend.json") })
        commandLine "node", configScript, "generate", configFile, promosDevAssets.get().asFile
    }
    tasks.configureEach {
        if (name in ["preReleaseBuild", "mergeReleaseAssets"]) {
            dependsOn generateConfig
        }
    }
    // Only the standalone release is allowed to carry the explicit DEV configuration.
    androidComponents.beforeVariants(androidComponents.selector().withBuildType("debug")) {
        it.enable = false
    }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    // Android app workspace root (apps/referidos-android).
    root = file("../..")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    reactNativeDir = file("../../../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    cliFile = file("../../../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    // Use the Android app Metro config for release bundle parity with debug.
    bundleConfig = file("../../metro.config.cjs")
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    // Keep the authenticated app and the local beta on independent bundle entry points.
    entryFile = promosBeta ? file("../../index.promos.js") : file("../../index.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // Windows guardrail: avoid Jest worker child-process spawn failures in release bundling.
    extraPackagerArgs = ["--max-workers", "1"]

    /* Hermes Commands */
    // Monorepo guardrail: app workspace root doesn't contain a physical
    // react-native/sdks copy, so hermesc must be resolved from repo root.
    hermesCommand = "../../node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds =
    (findProperty("android.enableProguardInReleaseBuilds") ?: "false").toBoolean()

def releaseStoreFile =
    findProperty("android.release.storeFile") ?: System.getenv("ANDROID_RELEASE_STORE_FILE")
def releaseStorePassword =
    findProperty("android.release.storePassword") ?: System.getenv("ANDROID_RELEASE_STORE_PASSWORD")
def releaseKeyAlias =
    findProperty("android.release.keyAlias") ?: System.getenv("ANDROID_RELEASE_KEY_ALIAS")
def releaseKeyPassword =
    findProperty("android.release.keyPassword") ?: System.getenv("ANDROID_RELEASE_KEY_PASSWORD")

def hasReleaseSigning =
    !promosBeta &&
    releaseStoreFile &&
    releaseStorePassword &&
    releaseKeyAlias &&
    releaseKeyPassword

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.referidosandroid"
    if (promosBeta) {
        sourceSets.release.manifest.srcFile(
            promosDev ? "src/promosDevRelease/AndroidManifest.xml" : "src/promosBetaRelease/AndroidManifest.xml"
        )
        if (promosDev) {
            sourceSets.release.assets.srcDir(promosDevAssets)
        }
    }
    defaultConfig {
        applicationId "com.referidosandroid"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode promosBeta ? 2 : 1
        versionName promosBeta ? "1.1" : "1.0"
        buildConfigField "boolean", "PROMOS_BETA", promosBeta.toString()
        manifestPlaceholders = [
            referidosAppLabel: promosBeta ? "Referidos Promos" : "@string/app_name",
            referidosAuthScheme: promosBeta ? "referidospromosbeta" : "referidosandroid",
            referidosPromoProviderEnabled: promosBeta.toString()
        ]
        if (promosBeta) {
            applicationIdSuffix ".promosbeta"
            ndk {
                abiFilters.addAll(findProperty("reactNativeArchitectures").toString().split(",").collect { it.trim() })
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Uses non-debug keystore when release signing props are provided.
            // The local beta and smoke builds use the debug keystore.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
